name: Autorix CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-go-services:
    name: Test Go Core Engines & SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [nexus, ego, janus, aegis, vulcan, hermes, sdk/go]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run unit tests
        run: |
          cd ${{ matrix.service }}
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

  build-console:
    name: Build Next.js Console & TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: Build TypeScript SDK
        run: |
          cd sdk/typescript
          npm install --prefer-offline || npm install
          npm run build

      - name: Build Autorix Console
        run: |
          cd console
          npm install --prefer-offline || npm install
          npm run build

  test-python-sdk:
    name: Validate Python SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Syntax
        run: |
          python -m py_compile sdk/python/autorix/*.py
