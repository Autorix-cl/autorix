name: Autorix Release Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Create the selected release and publish its GHCR images
        required: false
        default: false
        type: boolean
      release_tag:
        description: Immutable release tag to publish (required with publish=true)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-scan-images:
    name: Build, inventory, and scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: aegis
            context: .
            dockerfile: ./aegis/Dockerfile
          - service: argus
            context: .
            dockerfile: ./argus/Dockerfile
          - service: ego
            context: .
            dockerfile: ./ego/Dockerfile
          - service: hermes
            context: .
            dockerfile: ./hermes/Dockerfile
          - service: janus
            context: .
            dockerfile: ./janus/Dockerfile
          - service: nexus
            context: .
            dockerfile: ./nexus/Dockerfile
          - service: themis
            context: .
            dockerfile: ./themis/Dockerfile
          - service: vulcan
            context: .
            dockerfile: ./vulcan/Dockerfile
          - service: console
            context: ./console
            dockerfile: ./console/Dockerfile
    env:
      LOCAL_IMAGE: local/autorix-${{ matrix.service }}:${{ github.sha }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      PUBLISH_ENABLED: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.release_tag != '') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      # A tag publishes only after the same local image has been scanned below.
      # Manual runs remain local-only unless publish=true and release_tag are set.
      - name: Build local image
        uses: docker/build-push-action@v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ env.LOCAL_IMAGE }}
          load: true
          push: false
          provenance: false

      - name: Create report directories
        run: mkdir -p reports release-assets

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          output-file: reports/${{ matrix.service }}.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Generate vulnerability report with Grype
        uses: anchore/scan-action@v7.4.0
        with:
          image: ${{ env.LOCAL_IMAGE }}
          fail-build: false
          output-format: json
          output-file: reports/${{ matrix.service }}.vulnerabilities.json
          grype-version: v0.110.0

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH_ENABLED == 'true'
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image and record immutable digest
        if: env.PUBLISH_ENABLED == 'true'
        env:
          REMOTE_IMAGE: ghcr.io/${{ github.repository_owner }}/autorix-${{ matrix.service }}:${{ env.RELEASE_TAG }}
        run: |
          docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"
          docker push "$REMOTE_IMAGE"
          digest="$(docker buildx imagetools inspect "$REMOTE_IMAGE" --format '{{.Manifest.Digest}}')"
          case "$digest" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "Expected a SHA-256 image digest, got: $digest" >&2; exit 1 ;;
          esac
          printf '%s@%s\n' "$REMOTE_IMAGE" "$digest" > "release-assets/${{ matrix.service }}.image.txt"
          echo "REMOTE_IMAGE_DIGEST=$REMOTE_IMAGE@$digest" >> "$GITHUB_ENV"

      - name: Install pinned Cosign
        if: env.PUBLISH_ENABLED == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign immutable image digest with GitHub OIDC
        if: env.PUBLISH_ENABLED == 'true'
        run: cosign sign --yes "$REMOTE_IMAGE_DIGEST"

      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-evidence-${{ matrix.service }}
          path: |
            reports/
            release-assets/
          if-no-files-found: error
          retention-days: 30

  build-autorixctl:
    name: Build autorixctl ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ''
          - goos: linux
            goarch: arm64
            extension: ''
          - goos: darwin
            goarch: amd64
            extension: ''
          - goos: darwin
            goarch: arm64
            extension: ''
          - goos: windows
            goarch: amd64
            extension: .exe
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v6.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: cmd/autorixctl/go.sum

      - name: Build versioned binary
        working-directory: cmd/autorixctl
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../../release-assets
          go build -trimpath -ldflags "-s -w -X main.version=$RELEASE_TAG" \
            -o "../../release-assets/autorixctl_${GOOS}_${GOARCH}${{ matrix.extension }}" .

      - name: Upload autorixctl binary
        uses: actions/upload-artifact@v4.6.2
        with:
          name: autorixctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  create-github-release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.release_tag != '')
    needs: [build-scan-images, build-autorixctl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Download release evidence
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: release-evidence-*
          path: release-inputs
          merge-multiple: true

      - name: Download autorixctl binaries
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: autorixctl-*
          path: release-inputs
          merge-multiple: true

      - name: Assemble checksummed release assets
        run: |
          mkdir -p release-assets
          find release-inputs -type f -exec cp {} release-assets/ \;
          test "$(find release-assets -name '*.image.txt' | wc -l | tr -d ' ')" = 9
          test "$(find release-assets -name 'autorixctl_*' | wc -l | tr -d ' ')" = 5
          (cd release-assets && sha256sum * | sort > SHA256SUMS)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "Autorix $RELEASE_TAG" --generate-notes
          fi
