[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autorix"
version = "1.0.0"
description = "Official Python Client SDK for the Autorix IAM Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25.0"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0"]
flask = ["flask>=2.3.0"]
django = ["django>=4.2.0"]

[tool.setuptools.packages.find]
include = ["autorix*"]
