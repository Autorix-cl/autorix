version: "1.0"
project:
  name: "autorix"
  description: "Enterprise Zero Trust IAM Suite (Nexus, Ego, Janus, Aegis, Vulcan, Hermes, Themis, Console)"
  repository: "Autorix-cl/autorix"

persistence:
  mode: "openspec"

strict_tdd: true

stack:
  backend:
    language: "Go 1.25"
    services:
      nexus: "ReBAC + ABAC Zanzibar Engine (gRPC :50051)"
      ego: "Identity & User Lifecycle with Argon2id (REST :4433)"
      janus: "OAuth2 & OIDC Server with RS256 JWKS (REST :4444)"
      aegis: "Zero Trust PEP Reverse Proxy (HTTP :4455)"
      vulcan: "API Keys & Macaroons Manager (REST :4466)"
      hermes: "Enterprise SAML 2.0 & SCIM 2.0 (REST :4477)"
      themis: "Policy & Audit Engine (gRPC :50052)"
    database: "PostgreSQL 16"
  frontend:
    framework: "Next.js 15 (App Router, React 19)"
    styling: "Tailwind CSS + Shadcn UI"
    i18n: "Custom Context (EN / ES)"
    runtime: "Node 22 / Bun"

testing:
  runner: "go test"
  command: "go test -v -race ./..."
  coverage_command: "go test -coverprofile=coverage.out ./..."
  layers:
    - unit: "Package-level unit tests (*_test.go)"
    - integration: "gRPC & HTTP server integration tests"
    - contract: "JSON Schema traits & CEL expression tests"
  frontend_verification:
    type_check: "npm run build"
    lint: "npm run lint"
