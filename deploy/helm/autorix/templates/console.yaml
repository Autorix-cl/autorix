{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorix.fullname" . }}-console
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" . }}
      app.kubernetes.io/component: console
  template:
    metadata:
      {{- if ne (default "none" .Values.global.transportSecurity.provider) "none" }}
      annotations:
        {{- include "autorix.transportSecurityAnnotations" . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: console
    spec:
      securityContext:
        {{- include "autorix.podSecurityContext" . | nindent 8 }}
      {{- include "autorix.workloadAvailability" (dict "root" . "component" "console") | nindent 6 }}
      containers:
        - name: console
          image: {{ include "autorix.image" (dict "root" . "image" .Values.console.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "autorix.containerSecurityContext" (dict "root" . "override" .Values.console.containerSecurityContext) | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: ARGUS_INTERNAL_URL
              value: "http://{{ include "autorix.fullname" . }}-argus:4400"
            - name: AEGIS_INTERNAL_URL
              value: "http://{{ include "autorix.fullname" . }}-aegis:4456"
            - name: JANUS_INTERNAL_URL
              value: "http://{{ include "autorix.fullname" . }}-janus:4444"
            - name: JANUS_ADMIN_INTERNAL_URL
              value: "http://{{ include "autorix.fullname" . }}-janus-admin:4445"
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-console
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: console
{{- end }}
