{{- if .Values.nexus.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "autorix.fullname" . }}-nexus-hpa
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: nexus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "autorix.fullname" . }}-nexus
  minReplicas: {{ .Values.nexus.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.nexus.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.nexus.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
{{- if .Values.aegis.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "autorix.fullname" . }}-aegis-hpa
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aegis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "autorix.fullname" . }}-aegis
  minReplicas: {{ .Values.aegis.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.aegis.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.aegis.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
