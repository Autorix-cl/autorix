{{- if and .Values.monitoring .Values.monitoring.serviceMonitor .Values.monitoring.serviceMonitor.enabled }}
{{- $fullName := include "autorix.fullname" . -}}
{{- $labels := include "autorix.labels" . -}}
{{- $ports := dict "nexus" "http" "ego" "http" "janus" "http" "vulcan" "http" "hermes" "http" "themis" "http" "aegis" "admin" "argus" "http" -}}
{{- range $engine, $port := $ports }}
{{- if (index $.Values $engine).enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullName }}-{{ $engine }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: {{ $engine }}
    {{- with $.Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" $ }}
      app.kubernetes.io/component: {{ $engine }}
  endpoints:
    - port: {{ $port }}
      path: /metrics
      interval: {{ $.Values.monitoring.serviceMonitor.interval | default "15s" }}
      scrapeTimeout: {{ $.Values.monitoring.serviceMonitor.scrapeTimeout | default "10s" }}
{{- end }}
{{- end }}
{{- end }}
