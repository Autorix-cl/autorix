{{- if .Values.hermes.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorix.fullname" . }}-hermes
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: hermes
spec:
  replicas: {{ .Values.hermes.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" . }}
      app.kubernetes.io/component: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: hermes
    spec:
      containers:
        - name: hermes
          image: "{{ .Values.hermes.image.repository }}:{{ .Values.hermes.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 4477
              protocol: TCP
          env:
            - name: PORT
              value: "4477"
            - name: BASE_URL
              value: "https://sso.{{ .Values.global.domain }}"
            - name: DATABASE_URL
              value: "postgres://{{ .Values.global.postgresql.user }}:password@{{ .Values.global.postgresql.host }}:{{ .Values.global.postgresql.port }}/autorix_hermes?sslmode=disable"
          readinessProbe:
            httpGet:
              path: /saml/metadata
              port: 4477
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /saml/metadata
              port: 4477
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-hermes
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: hermes
spec:
  type: ClusterIP
  ports:
    - port: 4477
      targetPort: 4477
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: hermes
{{- end }}
