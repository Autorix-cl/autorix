{{- if .Values.hermes.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorix.fullname" . }}-hermes
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: hermes
spec:
  replicas: {{ .Values.hermes.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" . }}
      app.kubernetes.io/component: hermes
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4477"
        prometheus.io/path: "/metrics"
        {{- include "autorix.transportSecurityAnnotations" . | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: hermes
    spec:
      securityContext:
        {{- include "autorix.podSecurityContext" . | nindent 8 }}
      {{- include "autorix.workloadAvailability" (dict "root" . "component" "hermes") | nindent 6 }}
      containers:
        - name: hermes
          image: {{ include "autorix.image" (dict "root" . "image" .Values.hermes.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "autorix.containerSecurityContext" (dict "root" . "override" .Values.hermes.containerSecurityContext) | nindent 12 }}
          ports:
            - name: http
              containerPort: 4477
              protocol: TCP
          env:
            - name: PORT
              value: "4477"
            - name: BASE_URL
              value: "https://sso.{{ .Values.global.domain }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "global.postgresql.existingSecret is required" .Values.global.postgresql.existingSecret }}
                  key: {{ required "global.postgresql.databaseURLKeys.hermes is required" .Values.global.postgresql.databaseURLKeys.hermes }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4477
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/alive
              port: 4477
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-hermes
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: hermes
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4477"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 4477
      targetPort: 4477
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: hermes
{{- end }}
