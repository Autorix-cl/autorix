{{- if .Values.monitoring.alertmanager.enabled }}
{{- $alertmanager := .Values.monitoring.alertmanager -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorix.fullname" . }}-alertmanager
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
spec:
  replicas: {{ $alertmanager.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" . }}
      app.kubernetes.io/component: alertmanager
  template:
    metadata:
      annotations:
        {{- include "autorix.transportSecurityAnnotations" . | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: alertmanager
    spec:
      securityContext:
        {{- include "autorix.podSecurityContext" . | nindent 8 }}
      {{- include "autorix.workloadAvailability" (dict "root" . "component" "alertmanager") | nindent 6 }}
      containers:
        - name: alertmanager
          image: {{ include "autorix.image" (dict "root" . "image" $alertmanager.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - "--config.file=/etc/alertmanager/{{ $alertmanager.configKey }}"
            - "--storage.path=/alertmanager"
          securityContext:
            {{- include "autorix.containerSecurityContext" (dict "root" .) | nindent 12 }}
          ports:
            - name: http
              containerPort: 9093
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: storage
              mountPath: /alertmanager
          resources:
            {{- toYaml $alertmanager.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          secret:
            secretName: {{ required "monitoring.alertmanager.existingConfigSecret is required when Alertmanager is enabled" $alertmanager.existingConfigSecret }}
            items:
              - key: {{ required "monitoring.alertmanager.configKey is required" $alertmanager.configKey }}
                path: {{ $alertmanager.configKey }}
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-alertmanager
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9093
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: alertmanager
{{- end }}
