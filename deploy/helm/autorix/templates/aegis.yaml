{{- if .Values.aegis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorix.fullname" . }}-aegis
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aegis
spec:
  replicas: {{ .Values.aegis.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" . }}
      app.kubernetes.io/component: aegis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: aegis
    spec:
      containers:
        - name: aegis
          image: "{{ .Values.aegis.image.repository }}:{{ .Values.aegis.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 4455
              protocol: TCP
          env:
            - name: PORT
              value: "4455"
            - name: RULES_PATH
              value: "/app/rules/default.rules.yaml"
          resources:
            {{- toYaml .Values.aegis.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 4455
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4455
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-aegis
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aegis
spec:
  type: ClusterIP
  ports:
    - port: 4455
      targetPort: 4455
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: aegis
{{- end }}
