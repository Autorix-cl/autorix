{{- if .Values.aegis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorix.fullname" . }}-aegis
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aegis
spec:
  replicas: {{ .Values.aegis.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" . }}
      app.kubernetes.io/component: aegis
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4456"
        prometheus.io/path: "/metrics"
        {{- include "autorix.transportSecurityAnnotations" . | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: aegis
    spec:
      securityContext:
        {{- include "autorix.podSecurityContext" . | nindent 8 }}
      {{- include "autorix.workloadAvailability" (dict "root" . "component" "aegis") | nindent 6 }}
      containers:
        - name: aegis
          image: {{ include "autorix.image" (dict "root" . "image" .Values.aegis.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "autorix.containerSecurityContext" (dict "root" . "override" .Values.aegis.containerSecurityContext) | nindent 12 }}
          ports:
            - name: http
              containerPort: 4455
              protocol: TCP
            - name: admin
              containerPort: 4456
              protocol: TCP
          env:
            - name: PORT
              value: "4455"
            - name: ADMIN_PORT
              value: "4456"
            - name: JWT_JWKS_URL
              value: "https://auth.{{ .Values.global.domain }}/.well-known/jwks.json"
            - name: JWT_ISSUER
              value: "https://auth.{{ .Values.global.domain }}"
            - name: JWT_AUDIENCE
              value: "https://auth.{{ .Values.global.domain }}"
            - name: JWT_ALLOW_INSECURE_JWKS
              value: "false"
            - name: RULES_PATH
              value: "/app/rules/default.rules.yaml"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "global.postgresql.existingSecret is required" .Values.global.postgresql.existingSecret }}
                  key: {{ required "global.postgresql.databaseURLKeys.aegis is required" .Values.global.postgresql.databaseURLKeys.aegis }}
          resources:
            {{- toYaml .Values.aegis.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4456
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/alive
              port: 4456
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-aegis
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aegis
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4456"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 4455
      targetPort: 4455
      protocol: TCP
      name: http
    - port: 4456
      targetPort: 4456
      protocol: TCP
      name: admin
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: aegis
{{- end }}
