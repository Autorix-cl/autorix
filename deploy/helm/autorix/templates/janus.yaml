{{- if .Values.janus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorix.fullname" . }}-janus
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: janus
spec:
  replicas: {{ .Values.janus.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" . }}
      app.kubernetes.io/component: janus
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4444"
        prometheus.io/path: "/metrics"
        {{- include "autorix.transportSecurityAnnotations" . | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: janus
    spec:
      securityContext:
        {{- include "autorix.podSecurityContext" . | nindent 8 }}
      {{- include "autorix.workloadAvailability" (dict "root" . "component" "janus") | nindent 6 }}
      containers:
        - name: janus
          image: {{ include "autorix.image" (dict "root" . "image" .Values.janus.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "autorix.containerSecurityContext" (dict "root" . "override" .Values.janus.containerSecurityContext) | nindent 12 }}
          ports:
            - name: http
              containerPort: 4444
              protocol: TCP
            - name: admin
              containerPort: 4445
              protocol: TCP
          env:
            - name: PORT
              value: "4444"
            - name: ADMIN_HOST
              value: "0.0.0.0"
            - name: ADMIN_PORT
              value: "4445"
            - name: ISSUER_URL
              value: "https://auth.{{ .Values.global.domain }}"
            - name: KEY_RELOAD_INTERVAL
              value: {{ .Values.janus.keyReloadInterval | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ tpl (join "," .Values.janus.corsAllowedOrigins) . | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "global.postgresql.existingSecret is required" .Values.global.postgresql.existingSecret }}
                  key: {{ required "global.postgresql.databaseURLKeys.janus is required" .Values.global.postgresql.databaseURLKeys.janus }}
          resources:
            {{- toYaml .Values.janus.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4444
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/alive
              port: 4444
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-janus
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: janus
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4444"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 4444
      targetPort: 4444
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: janus
---
# Never reference this service from an Ingress or expose it as a LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-janus-admin
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: janus
spec:
  type: ClusterIP
  ports:
    - port: 4445
      targetPort: admin
      protocol: TCP
      name: admin
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: janus
{{- end }}
