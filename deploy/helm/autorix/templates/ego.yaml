{{- if .Values.ego.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorix.fullname" . }}-ego
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: ego
spec:
  replicas: {{ .Values.ego.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" . }}
      app.kubernetes.io/component: ego
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4433"
        prometheus.io/path: "/metrics"
        {{- include "autorix.transportSecurityAnnotations" . | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: ego
    spec:
      securityContext:
        {{- include "autorix.podSecurityContext" . | nindent 8 }}
      {{- include "autorix.workloadAvailability" (dict "root" . "component" "ego") | nindent 6 }}
      containers:
        - name: ego
          image: {{ include "autorix.image" (dict "root" . "image" .Values.ego.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "autorix.containerSecurityContext" (dict "root" . "override" .Values.ego.containerSecurityContext) | nindent 12 }}
          ports:
            - name: http
              containerPort: 4433
              protocol: TCP
          env:
            - name: PORT
              value: "4433"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "global.postgresql.existingSecret is required" .Values.global.postgresql.existingSecret }}
                  key: {{ required "global.postgresql.databaseURLKeys.ego is required" .Values.global.postgresql.databaseURLKeys.ego }}
          resources:
            {{- toYaml .Values.ego.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4433
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/alive
              port: 4433
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-ego
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: ego
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4433"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 4433
      targetPort: 4433
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: ego
{{- end }}
