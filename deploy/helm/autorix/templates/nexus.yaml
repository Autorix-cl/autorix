{{- if .Values.nexus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorix.fullname" . }}-nexus
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: nexus
spec:
  replicas: {{ .Values.nexus.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" . }}
      app.kubernetes.io/component: nexus
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        {{- include "autorix.transportSecurityAnnotations" . | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: nexus
    spec:
      securityContext:
        {{- include "autorix.podSecurityContext" . | nindent 8 }}
      {{- include "autorix.workloadAvailability" (dict "root" . "component" "nexus") | nindent 6 }}
      containers:
        - name: nexus
          image: {{ include "autorix.image" (dict "root" . "image" .Values.nexus.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "autorix.containerSecurityContext" (dict "root" . "override" .Values.nexus.containerSecurityContext) | nindent 12 }}
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "50051"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "global.postgresql.existingSecret is required" .Values.global.postgresql.existingSecret }}
                  key: {{ required "global.postgresql.databaseURLKeys.nexus is required" .Values.global.postgresql.databaseURLKeys.nexus }}
          resources:
            {{- toYaml .Values.nexus.resources | nindent 12 }}
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-nexus
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: nexus
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: nexus
{{- end }}
