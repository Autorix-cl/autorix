{{- if .Values.nexus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorix.fullname" . }}-nexus
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: nexus
spec:
  replicas: {{ .Values.nexus.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" . }}
      app.kubernetes.io/component: nexus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: nexus
    spec:
      containers:
        - name: nexus
          image: "{{ .Values.nexus.image.repository }}:{{ .Values.nexus.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: PORT
              value: "50051"
            - name: DATABASE_URL
              value: "postgres://{{ .Values.global.postgresql.user }}:password@{{ .Values.global.postgresql.host }}:{{ .Values.global.postgresql.port }}/autorix_nexus?sslmode=disable"
          resources:
            {{- toYaml .Values.nexus.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-nexus
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: nexus
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: nexus
{{- end }}
