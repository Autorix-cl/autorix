{{- if .Values.vulcan.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorix.fullname" . }}-vulcan
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: vulcan
spec:
  replicas: {{ .Values.vulcan.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" . }}
      app.kubernetes.io/component: vulcan
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4466"
        prometheus.io/path: "/metrics"
        {{- include "autorix.transportSecurityAnnotations" . | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: vulcan
    spec:
      securityContext:
        {{- include "autorix.podSecurityContext" . | nindent 8 }}
      {{- include "autorix.workloadAvailability" (dict "root" . "component" "vulcan") | nindent 6 }}
      containers:
        - name: vulcan
          image: {{ include "autorix.image" (dict "root" . "image" .Values.vulcan.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "autorix.containerSecurityContext" (dict "root" . "override" .Values.vulcan.containerSecurityContext) | nindent 12 }}
          ports:
            - name: http
              containerPort: 4466
              protocol: TCP
          env:
            - name: PORT
              value: "4466"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "global.postgresql.existingSecret is required" .Values.global.postgresql.existingSecret }}
                  key: {{ required "global.postgresql.databaseURLKeys.vulcan is required" .Values.global.postgresql.databaseURLKeys.vulcan }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4466
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/alive
              port: 4466
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-vulcan
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: vulcan
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4466"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 4466
      targetPort: 4466
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: vulcan
{{- end }}
