{{- if .Values.vulcan.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorix.fullname" . }}-vulcan
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: vulcan
spec:
  replicas: {{ .Values.vulcan.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" . }}
      app.kubernetes.io/component: vulcan
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: vulcan
    spec:
      containers:
        - name: vulcan
          image: "{{ .Values.vulcan.image.repository }}:{{ .Values.vulcan.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 4466
              protocol: TCP
          env:
            - name: PORT
              value: "4466"
            - name: DATABASE_URL
              value: "postgres://{{ .Values.global.postgresql.user }}:password@{{ .Values.global.postgresql.host }}:{{ .Values.global.postgresql.port }}/autorix_vulcan?sslmode=disable"
          readinessProbe:
            tcpSocket:
              port: 4466
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4466
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-vulcan
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: vulcan
spec:
  type: ClusterIP
  ports:
    - port: 4466
      targetPort: 4466
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: vulcan
{{- end }}
