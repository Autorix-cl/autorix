{{- if .Values.aegis.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "autorix.fullname" . }}-aegis-migrate
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aegis-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: aegis-migrate
    spec:
      restartPolicy: Never
      securityContext:
        {{- include "autorix.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "autorix.image" (dict "root" . "image" .Values.aegis.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["migrate"]
          securityContext:
            {{- include "autorix.containerSecurityContext" (dict "root" . "override" .Values.aegis.containerSecurityContext) | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "global.postgresql.existingSecret is required" .Values.global.postgresql.existingSecret }}
                  key: {{ required "global.postgresql.databaseURLKeys.aegis is required" .Values.global.postgresql.databaseURLKeys.aegis }}
          resources:
            {{- toYaml .Values.aegis.resources | nindent 12 }}
{{- end }}
