{{- if .Values.themis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorix.fullname" . }}-themis
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: themis
spec:
  replicas: {{ .Values.themis.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" . }}
      app.kubernetes.io/component: themis
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4488"
        prometheus.io/path: "/metrics"
        {{- include "autorix.transportSecurityAnnotations" . | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: themis
    spec:
      securityContext:
        {{- include "autorix.podSecurityContext" . | nindent 8 }}
      {{- include "autorix.workloadAvailability" (dict "root" . "component" "themis") | nindent 6 }}
      containers:
        - name: themis
          image: {{ include "autorix.image" (dict "root" . "image" .Values.themis.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "autorix.containerSecurityContext" (dict "root" . "override" .Values.themis.containerSecurityContext) | nindent 12 }}
          ports:
            - name: grpc
              containerPort: 50052
              protocol: TCP
            - name: http
              containerPort: 4488
              protocol: TCP
          env:
            - name: PORT
              value: "50052"
            - name: HTTP_PORT
              value: "4488"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "global.postgresql.existingSecret is required" .Values.global.postgresql.existingSecret }}
                  key: {{ required "global.postgresql.databaseURLKeys.themis is required" .Values.global.postgresql.databaseURLKeys.themis }}
          resources:
            {{- toYaml .Values.themis.resources | nindent 12 }}
          readinessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-themis
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: themis
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4488"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 50052
      targetPort: 50052
      protocol: TCP
      name: grpc
    - port: 4488
      targetPort: 4488
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: themis
{{- end }}
