{{- if .Values.themis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorix.fullname" . }}-themis
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: themis
spec:
  replicas: {{ .Values.themis.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autorix.name" . }}
      app.kubernetes.io/component: themis
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4488"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: {{ include "autorix.name" . }}
        app.kubernetes.io/component: themis
    spec:
      containers:
        - name: themis
          image: "{{ .Values.themis.image.repository }}:{{ .Values.themis.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: grpc
              containerPort: 50052
              protocol: TCP
            - name: http
              containerPort: 4488
              protocol: TCP
          env:
            - name: PORT
              value: "50052"
            - name: HTTP_PORT
              value: "4488"
            - name: DATABASE_URL
              value: "postgres://{{ .Values.global.postgresql.user }}:password@{{ .Values.global.postgresql.host }}:{{ .Values.global.postgresql.port }}/autorix_themis?sslmode=disable"
          resources:
            {{- toYaml .Values.themis.resources | nindent 12 }}
          readinessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autorix.fullname" . }}-themis
  labels:
    {{- include "autorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: themis
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4488"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 50052
      targetPort: 50052
      protocol: TCP
      name: grpc
    - port: 4488
      targetPort: 4488
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "autorix.name" . }}
    app.kubernetes.io/component: themis
{{- end }}
