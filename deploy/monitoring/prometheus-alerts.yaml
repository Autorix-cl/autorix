apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: autorix-alerts
  labels:
    role: alert-rules
    app: autorix
spec:
  groups:
    - name: autorix.rules
      rules:
        # 1. High ReBAC Latency Alert (Nexus)
        - alert: AutorixHighNexusLatency
          expr: histogram_quantile(0.99, sum(rate(autorix_nexus_check_duration_seconds_bucket[5m])) by (le)) > 0.02
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Autorix Nexus ReBAC P99 latency > 20ms"
            description: "Nexus graph evaluation latency is unusually high ({{ $value }}s)."

        # 2. High ABAC Policy Evaluation Latency (Themis)
        - alert: AutorixHighThemisLatency
          expr: histogram_quantile(0.99, sum(rate(autorix_themis_evaluation_duration_seconds_bucket[5m])) by (le)) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Autorix Themis policy evaluation P99 latency > 50ms"
            description: "Themis policy evaluation latency is unusually high ({{ $value }}s)."

        # 3. Aegis Rate of 403 Forbidden Access
        - alert: AutorixHighUnauthorizedRate
          expr: sum(rate(autorix_aegis_requests_total{status="403"}[5m])) / sum(rate(autorix_aegis_requests_total[5m])) > 0.1
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Autorix Aegis experiencing high 403 Forbidden rejection rate (> 10%)"
            description: "Possible brute force or misconfigured access policy."

        # 4. Hermes SCIM Sync Failure Rate
        - alert: AutorixHermesSCIMSyncFailures
          expr: sum(rate(autorix_hermes_scim_sync_total{status="error"}[5m])) / sum(rate(autorix_hermes_scim_sync_total[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Autorix Hermes SCIM synchronization failure rate > 5%"
            description: "Hermes SCIM directory synchronization is failing."

        # 5. Vulcan Key Verification Failure Rate
        - alert: AutorixVulcanKeyVerificationFailures
          expr: sum(rate(autorix_vulcan_keys_verified_total{status="invalid"}[5m])) / sum(rate(autorix_vulcan_keys_verified_total[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Autorix Vulcan key verification failure rate > 10%"
            description: "Vulcan cryptographic key verification is failing frequently."

        # 6. Janus Token Issuance Failures
        - alert: AutorixJanusTokenIssuanceFailures
          expr: sum(rate(autorix_janus_tokens_issued_total{status="error"}[5m])) / sum(rate(autorix_janus_tokens_issued_total[5m])) > 0.05
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Autorix Janus token issuance failure rate > 5%"
            description: "Janus OIDC token issuance requests are failing."

        # 7. Microservice Pod Restart Alert
        - alert: AutorixServiceCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{container=~"nexus|ego|janus|aegis|vulcan|hermes|themis|argus"}[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Autorix engine {{ $labels.container }} is restarting"
            description: "Pod is crash looping."


    # Availability SLO burn-rate alerts. They rely only on the shared HTTP RED
    # metric emitted by platform/metrics: 5xx responses are failures while 4xx
    # responses remain expected client/authentication outcomes.
    - name: autorix.slo
      rules:
        - alert: AutorixAvailabilityErrorBudgetFastBurn
          expr: |
            (
              (
                sum by (engine) (rate(autorix_http_requests_total{engine=~"aegis|ego|janus",status=~"5.."}[5m]))
                /
                sum by (engine) (rate(autorix_http_requests_total{engine=~"aegis|ego|janus"}[5m]))
              ) > (14.4 * 0.001)
            )
            and on (engine)
            (
              (
                sum by (engine) (rate(autorix_http_requests_total{engine=~"aegis|ego|janus",status=~"5.."}[1h]))
                /
                sum by (engine) (rate(autorix_http_requests_total{engine=~"aegis|ego|janus"}[1h]))
              ) > (14.4 * 0.001)
            )
            and on (engine)
            (sum by (engine) (rate(autorix_http_requests_total{engine=~"aegis|ego|janus"}[5m])) > 0)
          for: 2m
          labels:
            severity: page
            slo: availability
            objective: "99.9"
          annotations:
            summary: "Autorix {{ $labels.engine }} is burning its availability error budget rapidly"
            description: "5xx rate exceeds the 14.4x burn threshold for both 5m and 1h windows. Investigate the service and its dependencies."
        - alert: AutorixAvailabilityErrorBudgetSlowBurn
          expr: |
            (
              (
                sum by (engine) (rate(autorix_http_requests_total{engine=~"aegis|ego|janus",status=~"5.."}[30m]))
                /
                sum by (engine) (rate(autorix_http_requests_total{engine=~"aegis|ego|janus"}[30m]))
              ) > (6 * 0.001)
            )
            and on (engine)
            (
              (
                sum by (engine) (rate(autorix_http_requests_total{engine=~"aegis|ego|janus",status=~"5.."}[6h]))
                /
                sum by (engine) (rate(autorix_http_requests_total{engine=~"aegis|ego|janus"}[6h]))
              ) > (6 * 0.001)
            )
            and on (engine)
            (sum by (engine) (rate(autorix_http_requests_total{engine=~"aegis|ego|janus"}[30m])) > 0)
          for: 15m
          labels:
            severity: ticket
            slo: availability
            objective: "99.9"
          annotations:
            summary: "Autorix {{ $labels.engine }} is burning its availability error budget"
            description: "5xx rate exceeds the 6x burn threshold for both 30m and 6h windows. Investigate before the monthly SLO is at risk."
