global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

# The optional Compose alertmanager service resolves this target only when the
# `alerts` profile is enabled. Prometheus continues evaluating rules if it is
# intentionally absent; notification delivery is then unavailable by design.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "autorix"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "argus:4400"
          - "nexus:8080"
          - "ego:4433"
          - "janus:4444"
          - "vulcan:4466"
          - "hermes:4477"
          - "themis:4488"
          - "aegis:4456"
