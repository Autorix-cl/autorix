# Reference only: install External Secrets Operator and provision the
# ClusterSecretStore named below through the platform team first. The remote
# secret must contain one complete TLS PostgreSQL URL per listed property.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autorix-db-credentials
  namespace: autorix
  labels:
    app.kubernetes.io/part-of: autorix
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: autorix-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: aegis-database-url
      remoteRef: {key: autorix/production/database-urls, property: aegis-database-url}
    - secretKey: argus-database-url
      remoteRef: {key: autorix/production/database-urls, property: argus-database-url}
    - secretKey: ego-database-url
      remoteRef: {key: autorix/production/database-urls, property: ego-database-url}
    - secretKey: hermes-database-url
      remoteRef: {key: autorix/production/database-urls, property: hermes-database-url}
    - secretKey: janus-database-url
      remoteRef: {key: autorix/production/database-urls, property: janus-database-url}
    - secretKey: nexus-database-url
      remoteRef: {key: autorix/production/database-urls, property: nexus-database-url}
    - secretKey: themis-database-url
      remoteRef: {key: autorix/production/database-urls, property: themis-database-url}
    - secretKey: vulcan-database-url
      remoteRef: {key: autorix/production/database-urls, property: vulcan-database-url}
