# Reference only. The secret backend owns these values; no object-store
# credentials belong in Git, Helm values, or Kubernetes manifests.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-object-store-credentials
  namespace: autorix
  labels:
    app.kubernetes.io/part-of: autorix
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: cnpg-object-store-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: autorix/production/cnpg-object-store, property: access-key-id}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: autorix/production/cnpg-object-store, property: secret-access-key}
