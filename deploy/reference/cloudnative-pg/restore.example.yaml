# Do not apply this alongside the primary cluster. Use a new namespace and a
# unique Cluster name during a drill or an incident recovery.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: autorix-postgres-restore
  namespace: autorix-recovery
  labels:
    app.kubernetes.io/part-of: autorix
spec:
  instances: 1
  storage:
    size: 100Gi
    storageClass: REPLACE_WITH_ENCRYPTED_STORAGE_CLASS
  bootstrap:
    recovery:
      source: production-backup
  externalClusters:
    - name: production-backup
      barmanObjectStore:
        destinationPath: s3://REPLACE_WITH_DEDICATED_BUCKET/autorix-postgres/
        endpointURL: https://object-storage.example.invalid
        s3Credentials:
          accessKeyId:
            name: cnpg-object-store-credentials
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: cnpg-object-store-credentials
            key: ACCESS_SECRET_KEY
