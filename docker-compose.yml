# The required local path is `docker compose --profile core up`; optional
# observability and documentation live in the `extended` profile.
services:
  postgres:
    image: postgres:16-alpine
    container_name: autorix-postgres
    profiles: ["core"]
    environment:
      POSTGRES_USER: autorix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./scripts/generate-local-secrets.sh first}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./nexus/migrations:/docker-entrypoint-initdb.d/01-nexus:ro
      - ./ego/migrations:/docker-entrypoint-initdb.d/02-ego:ro
      - ./janus/migrations:/docker-entrypoint-initdb.d/03-janus:ro
      - ./vulcan/migrations:/docker-entrypoint-initdb.d/04-vulcan:ro
      - ./hermes/migrations:/docker-entrypoint-initdb.d/05-hermes:ro
      - ./themis/migrations:/docker-entrypoint-initdb.d/06-themis:ro
      - ./argus/migrations:/docker-entrypoint-initdb.d/07-argus:ro
      - ./aegis/migrations:/docker-entrypoint-initdb.d/08-aegis:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autorix -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  argus:
    build:
      context: .
      dockerfile: argus/Dockerfile
    container_name: autorix-argus
    profiles: ["core"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:50053:50053"
      - "127.0.0.1:4400:4400"
    environment:
      PORT: "50053"
      HTTP_PORT: "4400"
      DATABASE_URL: "postgres://autorix:${POSTGRES_PASSWORD}@postgres:5432/autorix_argus?sslmode=disable"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4400/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  nexus:
    build:
      context: .
      dockerfile: nexus/Dockerfile
    container_name: autorix-nexus
    profiles: ["core"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "50051"
      HTTP_PORT: "8080"
      DATABASE_URL: "postgres://autorix:${POSTGRES_PASSWORD}@postgres:5432/autorix_nexus?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      argus:
        condition: service_healthy

  ego:
    build:
      context: .
      dockerfile: ego/Dockerfile
    container_name: autorix-ego
    profiles: ["core"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4433:4433"
    environment:
      PORT: "4433"
      DATABASE_URL: "postgres://autorix:${POSTGRES_PASSWORD}@postgres:5432/autorix_ego?sslmode=disable"
      # Local compose serves ego over plain HTTP; a Secure cookie would
      # never be sent back by the browser. Production deployments (behind
      # TLS) must leave this unset so it defaults to true.
      SECURE_COOKIES: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4433/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      argus:
        condition: service_healthy

  janus:
    build:
      context: .
      dockerfile: janus/Dockerfile
    container_name: autorix-janus
    profiles: ["core"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4444:4444"
    environment:
      PORT: "4444"
      ADMIN_HOST: "0.0.0.0"
      ADMIN_PORT: "4445"
      ISSUER_URL: "http://localhost:4444"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      DATABASE_URL: "postgres://autorix:${POSTGRES_PASSWORD}@postgres:5432/autorix_janus?sslmode=disable"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4444/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      argus:
        condition: service_healthy

  vulcan:
    build:
      context: .
      dockerfile: vulcan/Dockerfile
    container_name: autorix-vulcan
    profiles: ["extended"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4466:4466"
    environment:
      PORT: "4466"
      DATABASE_URL: "postgres://autorix:${POSTGRES_PASSWORD}@postgres:5432/autorix_vulcan?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4466/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      argus:
        condition: service_healthy

  hermes:
    build:
      context: .
      dockerfile: hermes/Dockerfile
    container_name: autorix-hermes
    profiles: ["extended"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4477:4477"
    environment:
      PORT: "4477"
      BASE_URL: "http://localhost:4477"
      DATABASE_URL: "postgres://autorix:${POSTGRES_PASSWORD}@postgres:5432/autorix_hermes?sslmode=disable"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4477/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      argus:
        condition: service_healthy

  themis:
    build:
      context: .
      dockerfile: themis/Dockerfile
    container_name: autorix-themis
    profiles: ["extended"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:50052:50052"
      - "127.0.0.1:4488:4488"
    environment:
      PORT: "50052"
      HTTP_PORT: "4488"
      DATABASE_URL: "postgres://autorix:${POSTGRES_PASSWORD}@postgres:5432/autorix_themis?sslmode=disable"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4488/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      argus:
        condition: service_healthy

  aegis:
    build:
      context: .
      dockerfile: aegis/Dockerfile
    container_name: autorix-aegis
    profiles: ["core"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4455:4455"
    environment:
      PORT: "4455"
      ADMIN_PORT: "4456"
      JWT_JWKS_URL: "http://janus:4444/.well-known/jwks.json"
      JWT_ISSUER: "http://localhost:4444"
      JWT_AUDIENCE: "http://localhost:4444"
      # Development only: production JWKS requires HTTPS.
      JWT_ALLOW_INSECURE_JWKS: "true"
      DATABASE_URL: "postgres://autorix:${POSTGRES_PASSWORD}@postgres:5432/autorix_aegis?sslmode=disable"
      RULES_PATH: "/app/rules/default.rules.yaml"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4456/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      nexus:
        condition: service_healthy
      janus:
        condition: service_healthy
      argus:
        condition: service_healthy

  console:
    build:
      context: ./console
      dockerfile: Dockerfile
    container_name: autorix-console
    profiles: ["core"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_ARGUS_URL: "http://localhost:4400"
      NEXT_PUBLIC_NEXUS_URL: "http://localhost:8080"
      NEXT_PUBLIC_EGO_URL: "http://localhost:4433"
      NEXT_PUBLIC_JANUS_URL: "http://localhost:4444"
      NEXT_PUBLIC_AEGIS_URL: "http://localhost:4455"
      NEXT_PUBLIC_VULCAN_URL: "http://localhost:4466"
      NEXT_PUBLIC_HERMES_URL: "http://localhost:4477"
      NEXT_PUBLIC_THEMIS_URL: "http://localhost:4488"
      ARGUS_INTERNAL_URL: "http://argus:4400"
      NEXUS_INTERNAL_URL: "http://nexus:8080"
      EGO_INTERNAL_URL: "http://ego:4433"
      JANUS_INTERNAL_URL: "http://janus:4444"
      JANUS_ADMIN_INTERNAL_URL: "http://janus:4445"
      AEGIS_INTERNAL_URL: "http://aegis:4456"
      VULCAN_INTERNAL_URL: "http://vulcan:4466"
      HERMES_INTERNAL_URL: "http://hermes:4477"
      THEMIS_INTERNAL_URL: "http://themis:4488"
    depends_on:
      argus:
        condition: service_healthy
      nexus:
        condition: service_healthy
      aegis:
        condition: service_healthy
      ego:
        condition: service_healthy
      janus:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: autorix-prometheus
    restart: unless-stopped
    profiles: ["extended"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/prometheus-alerts.yml:/etc/prometheus/rules/autorix.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      argus:
        condition: service_healthy
      nexus:
        condition: service_healthy
      ego:
        condition: service_healthy
      janus:
        condition: service_healthy
      vulcan:
        condition: service_healthy
      hermes:
        condition: service_healthy
      themis:
        condition: service_healthy
      aegis:
        condition: service_healthy

  # Alertmanager is deliberately opt-in. The default example configuration
  # discards notifications, so operators must point ALERTMANAGER_CONFIG_PATH
  # at their own receiver configuration before enabling this profile.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: autorix-alertmanager
    restart: unless-stopped
    profiles: ["alerts"]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ${ALERTMANAGER_CONFIG_PATH:-./deploy/monitoring/alertmanager.example.yml}:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    container_name: autorix-docs
    restart: unless-stopped
    profiles: ["extended"]
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: autorix-redis
    profiles: ["core"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
